name: Tests

on:
  push:
    branches: [main, "product/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: JUnit (SDK-independent JVM subset, not Android/ATAK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local scratch paths
        run: |
          printf 'JAVA_TEST_CACHE=%s/java-dependencies\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'JAVA_TEST_SCRATCH=%s/java-runner-fixtures\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline release-prerequisite checker
        run: python3 -m unittest discover -s tests -v
      - name: Test verification infrastructure
        run: python3 -m unittest discover -s verification -p 'test_*.py' -v
      - name: Enumerate included and excluded existing tests
        run: python3 scripts/test_java.py --list
      - name: Compile current pure-Java sources and execute existing JUnit tests
        run: python3 scripts/test_java.py
      - name: State coverage boundary
        if: always()
        run: |
          printf '%s\n' 'This job tests an SDK-independent JVM source subset and generic release tooling.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Use the uploaded current-run summary.json for actual counts and pass/fail evidence; absent reports mean execution was not verified.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'It does NOT build an APK or validate Android/ATAK integration, signing, sensors, UI, or device behavior. A real licensed SDK is required for those checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JVM reports and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-subset-test-report
          path: verification/build/jvm/
          if-no-files-found: warn

  sim-lint:
    name: Web simulator structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sim/index.html
        run: |
          test -f sim/index.html
          grep -q "ADVERSARY_SYSTEMS" sim/index.html
          grep -q "RADIO_PROFILES" sim/index.html
          grep -q "DEMO_SCENARIO" sim/index.html
          grep -q "RiskScorer" sim/index.html
          grep -q "DisplacementSearch" sim/index.html
          OPEN=$(grep -c '<script' sim/index.html)
          CLOSE=$(grep -c '</script>' sim/index.html)
          if [ "$OPEN" != "$CLOSE" ]; then
            echo "script tag mismatch: $OPEN open / $CLOSE close"
            exit 1
          fi
          echo "sim/index.html structure OK"
