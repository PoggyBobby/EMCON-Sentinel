# Copy to local.properties; this file contains PLACEHOLDERS, not credentials.
# local.properties is gitignored. Keep real credentials and keystores local.
# Use absolute paths with forward slashes and key=value entries.
# Get the ATAK SDK separately and verify its license and host version.
sdk.dir=/absolute/path/to/android-sdk
sdk.path=/absolute/path/to/atak-civ-sdk
takdev.plugin=/absolute/path/to/atak-civ-sdk/atak-gradle-takdev.jar

# Current Gradle configuration evaluates BOTH signing configurations eagerly.
# A random key may build an APK but does NOT establish host acceptance.
# Supply only signing material authorized for your intended ATAK host.
takDebugKeyFile=/absolute/path/to/debug-signing.keystore
takDebugKeyFilePassword=<set locally>
takDebugKeyAlias=<set locally>
takDebugKeyPassword=<set locally>
takReleaseKeyFile=/absolute/path/to/release-signing.keystore
takReleaseKeyFilePassword=<set locally>
takReleaseKeyAlias=<set locally>
takReleaseKeyPassword=<set locally>

# Authenticated TAK repository setup is an alternative to the local takdev JAR.
# Leave takrepo.url unset for the local-SDK path above.
# The offline release doctor does not validate repository authentication.
# takrepo.url=https://artifacts.tak.gov/artifactory/maven
# takrepo.user=<set locally>
# takrepo.password=<set locally>
